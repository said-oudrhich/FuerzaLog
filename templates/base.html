<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FuerzaLog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'entrenamiento_list' %}">FuerzaLog</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <form class="d-flex me-3" action="{% url 'buscar' %}" method="get">
                        <input class="form-control me-2" type="search" name="q" placeholder="Buscar...">
                        <button class="btn btn-outline-light" type="submit">Buscar</button>
                    </form>
                    <a class="nav-link" href="{% url 'entrenamiento_list' %}">Mis Entrenamientos</a>
                    <a class="nav-link" href="{% url 'entrenamiento_create' %}">Crear Entrenamiento</a>
                    <span class="navbar-text mx-3">Hola, {{ user.username }}</span>
                    <a class="nav-link" href="{% url 'logout' %}">Cerrar Sesión</a>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Iniciar Sesión</a>
                    <a class="nav-link" href="{% url 'registro' %}">Registro</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
