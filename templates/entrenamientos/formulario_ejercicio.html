{% extends "base.html" %}

{% block title %}{% if form.instance.pk %}Editar{% else %}Nuevo{% endif %} Ejercicio{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <h2 class="mb-4">{% if form.instance.pk %}Editar{% else %}Añadir nuevo{% endif %} ejercicio</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'ejercicio_list' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
