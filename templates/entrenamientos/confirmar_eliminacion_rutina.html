{% extends "base.html" %}

{% block title %}Eliminar Rutina{% endblock %}

{% block content %}
    <h2>¿Seguro que quieres eliminar esta rutina?</h2>
    <p><strong>{{ rutina.nombre }}</strong></p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
        <a href="{% url 'rutina_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
