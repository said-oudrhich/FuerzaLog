{% extends "base.html" %}

{% block title %}{% if form.instance.pk %}Editar{% else %}Crear{% endif %} Entrenamiento{% endblock %}

{% block content %}
    <h2>{% if form.instance.pk %}Editar{% else %}Crear Nuevo{% endif %} Entrenamiento</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'entrenamiento_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
